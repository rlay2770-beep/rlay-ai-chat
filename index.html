<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLay AI Chatbot</title>
    <!-- Marked.js for Code & Markdown Formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: #131314; color: #e3e3e3; display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

        /* Login Container */
        #auth-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #131314; z-index: 100; display: flex;
            justify-content: center; align-items: center; flex-direction: column; gap: 15px;
        }
        .login-card {
            background: #1e1f20; padding: 30px; border-radius: 16px; border: 1px solid #333;
            text-align: center; max-width: 350px; width: 90%;
        }
        .login-card h2 { color: #a8c7fa; margin-bottom: 20px; }
        .login-card input {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
            border: 1px solid #444; background: #2a2a2a; color: white; outline: none;
        }
        .auth-btn {
            width: 100%; padding: 12px; background: #a8c7fa; color: #040c1e;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        /* Sidebar for Chat History */
        .sidebar {
            width: 260px; background-color: #1e1f20; border-right: 1px solid #2e2f31;
            display: flex; flex-direction: column; padding: 15px;
        }
        .new-chat-btn {
            background: #a8c7fa; color: #040c1e; border: none; padding: 12px;
            border-radius: 20px; font-weight: bold; cursor: pointer; margin-bottom: 15px;
        }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            padding: 10px 12px; border-radius: 8px; background: #2a2a2a;
            cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center;
        }
        .history-item.active { background: #007bff; color: white; }
        .user-profile { padding-top: 10px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { color: #ff4d4d; background: none; border: none; cursor: pointer; font-size: 12px; }

        /* Main Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .header { padding: 15px; background: #1e1f20; border-bottom: 1px solid #2e2f31; text-align: center; }
        .header h3 { margin: 0; color: #a8c7fa; font-size: 16px; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { background: #282a2c; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #1e1f20; color: #c4c7c5; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #2e2f31; }

        /* Code Styling */
        pre { background: #0d0e0f; padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid #333; }
        code { font-family: monospace; color: #75beff; }

        /* Input Area */
        .input-area-wrapper { padding: 15px; background: #131314; }
        .input-area { max-width: 800px; margin: 0 auto; display: flex; background: #1e1f20; border-radius: 28px; padding: 6px 12px; border: 1px solid #333; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; padding: 10px 15px; font-size: 15px; outline: none; }
        button.send-btn { background: #a8c7fa; color: #040c1e; border: none; border-radius: 20px; padding: 8px 18px; font-weight: bold; cursor: pointer; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 150px; }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="auth-container">
        <div class="login-card">
            <h2>RLay AI Login</h2>
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPassword" placeholder="Password">
            <button class="auth-btn" onclick="handleLogin()">အကောင့်ဝင်မည်</button>
            <button class="auth-btn" style="background: #2a2a2a; color: #a8c7fa;" onclick="handleRegister()">အကောင့်သစ်ဖွင့်မည်</button>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ စကားဝိုင်းအသစ်</button>
        <div class="history-list" id="historyList"></div>
        <div class="user-profile">
            <span id="userDisplay" style="font-size: 12px; color: #aaa;"></span>
            <button class="logout-btn" onclick="handleLogout()">ထွက်မည်</button>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="main-chat">
        <div class="header">
            <h3>✨ RLay AI Assistant</h3>
        </div>

        <div id="chat-box"></div>

        <div class="input-area-wrapper">
            <div class="input-area">
                <input type="text" id="userInput" placeholder="တစ်ခုခု မေးမြန်းပါ..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">မေးမည်</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            onAuthStateChanged, signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, doc, setDoc, getDocs, query, where, orderBy, onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ပေးပို့ထားသော Firebase Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyDOkVig413DDIo1ouusq2qhTIeb3jUMU24",
            authDomain: "rlay-ai-chat.firebaseapp.com",
            databaseURL: "https://rlay-ai-chat-default-rtdb.firebaseio.com",
            projectId: "rlay-ai-chat",
            storageBucket: "rlay-ai-chat.firebasestorage.app",
            messagingSenderId: "615991559092",
            appId: "1:615991559092:web:43ea7ee7b1439ab3dbe8e1",
            measurementId: "G-PM0242NLLE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const API_KEY = "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";
        const systemPrompt = "You are an advanced AI assistant built like Google Gemini. Always respond in fluent, grammatically correct, and polite Myanmar language. Write code inside Markdown code blocks.";

        let currentUser = null;
        let currentSessionId = null;
        let activeMessages = [];

        // Auth Monitor
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("auth-container").style.display = "none";
                document.getElementById("userDisplay").innerText = user.email;
                loadUserHistory();
            } else {
                currentUser = null;
                document.getElementById("auth-container").style.display = "flex";
            }
        });

        // Auth Actions
        window.handleRegister = async () => {
            const email = document.getElementById("authEmail").value;
            const pass = document.getElementById("authPassword").value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert(e.message); }
        };

        window.handleLogin = async () => {
            const email = document.getElementById("authEmail").value;
            const pass = document.getElementById("authPassword").value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert(e.message); }
        };

        window.handleLogout = () => signOut(auth);

        // Chat History Logic
        async function loadUserHistory() {
            const q = query(collection(db, "chats"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                const listEl = document.getElementById("historyList");
                listEl.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const item = document.createElement("div");
                    item.className = `history-item ${docSnap.id === currentSessionId ? 'active' : ''}`;
                    item.innerText = data.title || "စကားဝိုင်း";
                    item.onclick = () => selectSession(docSnap.id, data.messages);
                    listEl.appendChild(item);
                });
            });
        }

        window.createNewChat = () => {
            currentSessionId = null;
            activeMessages = [{ role: "system", content: systemPrompt }];
            document.getElementById("chat-box").innerHTML = "";
        };

        function selectSession(id, messages) {
            currentSessionId = id;
            activeMessages = messages;
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
            messages.forEach(msg => {
                if (msg.role === "user") chatBox.innerHTML += `<div class="message user">${msg.content}</div>`;
                if (msg.role === "assistant") chatBox.innerHTML += `<div class="message bot">${marked.parse(msg.content)}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Send Message
        window.sendMessage = async () => {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = "";

            activeMessages.push({ role: "user", content: text });

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: activeMessages,
                        temperature: 0.6
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    activeMessages.push({ role: "assistant", content: aiReply });
                    chatBox.innerHTML += `<div class="message bot">${marked.parse(aiReply)}</div>`;

                    // Save to Firestore Database
                    if (!currentSessionId) {
                        const newDoc = await addDoc(collection(db, "chats"), {
                            userId: currentUser.uid,
                            title: text.substring(0, 20),
                            messages: activeMessages,
                            createdAt: new Date()
                        });
                        currentSessionId = newDoc.id;
                    } else {
                        await setDoc(doc(db, "chats", currentSessionId), {
                            userId: currentUser.uid,
                            messages: activeMessages
                        }, { merge: true });
                    }
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot" style="color:red;">Error ဖြစ်ပေါ်နေပါသည်။</div>`;
            }
        };
    </script>
</body>
    </html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RLay AI Assistant</title>
    <!-- Code Blocks များ သေချာ ပြသရန် Marked.js ထည့်သွင်းခြင်း -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Firebase SDK Modules (Auth & Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 သင့်ရဲ့ Firebase Config Details များကို အောက်တွင် ထည့်ပေးပါ
        const firebaseConfig = {
  apiKey: "AIzaSyDOkVig413DDIo1ouusq2qhTIeb3jUMU24",
  authDomain: "rlay-ai-chat.firebaseapp.com",
  databaseURL: "https://rlay-ai-chat-default-rtdb.firebaseio.com",
  projectId: "rlay-ai-chat",
  storageBucket: "rlay-ai-chat.firebasestorage.app",
  messagingSenderId: "615991559092",
  appId: "1:615991559092:web:43ea7ee7b1439ab3dbe8e1",
  measurementId: "G-PM0242NLLE"
};
        

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // Global Object သို့ မဖြစ်မနေ ချိတ်ဆက်ပေးခြင်း
        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                alert("Login Error: " + error.message);
            }
        };

        window.logoutGoogle = async function() {
            await signOut(auth);
            location.reload();
        };

        onAuthStateChanged(auth, (user) => {
            const authBtn = document.getElementById("authBtn");
            if (user) {
                currentUser = user;
                authBtn.innerText = "ထွက်မည် (" + (user.displayName ? user.displayName.split(" ")[0] : "User") + ")";
                authBtn.onclick = window.logoutGoogle;
                loadUserHistory();
            } else {
                currentUser = null;
                authBtn.innerText = "အကောင့်ဝင်ရန်";
                authBtn.onclick = window.loginWithGoogle;
            }
        });

        // --- Firestore သို့ Chat မေးခွန်းနှင့် အဖြေ သိမ်းဆည်းခြင်း ---
        window.saveChatToFirestore = async function(userText, aiReplyText) {
            if (!currentUser) return;
            try {
                await addDoc(collection(db, "user_chats"), {
                    userId: currentUser.uid,
                    userMessage: userText,
                    aiResponse: aiReplyText,
                    timestamp: serverTimestamp()
                });
                loadUserHistory();
            } catch (e) {
                console.error("Firestore Save Error: ", e);
            }
        };

        // --- Firestore မှ History ပြန်လည်ဆွဲယူခြင်း (Index Error ကင်းလွတ်အောင် ပြင်ထားသည်) ---
        async function loadUserHistory() {
            if (!currentUser) return;
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";

            try {
                // Index Error မတက်စေရန် Client-side Sorting အဖြစ် ပြောင်းလဲထားသည်
                const q = query(
                    collection(db, "user_chats"),
                    where("userId", "==", currentUser.uid)
                );
                const querySnapshot = await getDocs(q);
                
                let docs = [];
                querySnapshot.forEach(doc => docs.push(doc.data()));
                
                // Timestamp အလိုက် client-side တွင် ဖြန့်စီခြင်း
                docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                docs.forEach((data) => {
                    const item = document.createElement("div");
                    item.className = "history-item";
                    item.innerText = data.userMessage;
                    item.onclick = () => {
                        window.renderHistoricalChat(data.userMessage, data.aiResponse);
                        window.toggleSidebar();
                    };
                    historyList.appendChild(item);
                });
            } catch (e) {
                console.error("History Loading Error:", e);
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; background-color: #131314; color: #e3e3e3; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header UI Layering Fix */
        .header { padding: 12px 16px; background: #1e1f20; border-bottom: 1px solid #2e2f31; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header h3 { margin: 0; color: #a8c7fa; font-size: 16px; font-weight: 600; }
        .menu-btn, .auth-btn, .new-chat-btn { background: #282a2c; border: 1px solid #333; color: #e3e3e3; padding: 6px 12px; border-radius: 18px; font-size: 13px; cursor: pointer; }
        .auth-btn { background: #a8c7fa; color: #040c1e; font-weight: bold; border: none; }

        /* UI Frozen / Click Blocked Fix (Overlay & Sidebar) */
        .sidebar-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            opacity: 0; 
            pointer-events: none; /* UI ပိတ်မနေစေရန် အရေးကြီးသော ပြင်ဆင်ချက် */
            transition: opacity 0.3s ease; 
            z-index: 99; 
        }
        .sidebar-overlay.active { 
            opacity: 1; 
            pointer-events: auto; 
        }

        .sidebar { 
            position: fixed; 
            top: 0; 
            left: -280px; 
            width: 280px; 
            height: 100%; 
            background: #1e1f20; 
            border-right: 1px solid #2e2f31; 
            transition: left 0.3s ease; 
            z-index: 100; 
            display: flex; 
            flex-direction: column; 
            padding: 16px; 
        }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { padding: 10px; background: #282a2c; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c4c7c5; }
        .history-item:hover { background: #333537; }

        /* Chat Area Scroll Fix */
        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
        .message { max-width: 90%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
        .user { background: #282a2c; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #1e1f20; color: #c4c7c5; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2e2f31; }

        /* Code Block Styling */
        pre { background: #0d0e0f; padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid #333; margin: 8px 0; }
        code { font-family: monospace; color: #75beff; font-size: 14px; }

        /* Input Area */
        .input-area-wrapper { padding: 12px 16px; background: #131314; border-top: 1px solid #2e2f31; }
        .input-area { max-width: 800px; margin: 0 auto; display: flex; background: #1e1f20; border-radius: 28px; padding: 4px 8px 4px 16px; border: 1px solid #333; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
        button.send-btn { background: #a8c7fa; color: #040c1e; border: none; border-radius: 20px; padding: 8px 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Overlay & Sidebar Drawer -->
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h4 style="margin:0; color:#a8c7fa;">Chat History</h4>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" style="width: 100%; margin-bottom: 12px;" onclick="startNewChat()">+ စာမျက်နှာအသစ် (New Chat)</button>
        <div class="history-list" id="history-list">
            <!-- Dynamic History List Items -->
        </div>
    </div>

    <!-- Header Section -->
    <div class="header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰ History</button>
            <h3>✨ RLay Developer AI</h3>
        </div>
        <div>
            <button class="auth-btn" id="authBtn">အကောင့်ဝင်ရန်</button>
        </div>
    </div>

    <!-- Chat Message Container -->
    <div id="chat-box">
        <div class="message bot">မင်္ဂလာပါ! ကျွန်တော်က RLay Developer AI ဖြစ်ပါတယ်။ HTML/CSS/JS Coding နဲ့ Web-to-App ဖန်တီးမှုတွေမှာ ဘာတွေ ကူညီပေးရမလဲခင်ဗျာ။</div>
    </div>

    <!-- Chat Input Section -->
    <div class="input-area-wrapper">
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Coding သို့မဟုတ် တစ်ခုခု မေးမြန်းပါ..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">မေးမည်</button>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        
        let activeMessages = [
            { 
                role: "system", 
                content: "You are RLay AI, an expert software developer and Web Coding specialist. You help users build websites and mobile apps, especially for users coding on mobile devices. When asked for code (like HTML, CSS, JavaScript), write clean, complete, and functional code inside Markdown code blocks. Always respond in fluent, accurate, and natural Myanmar language." 
            }
        ];

        // Sidebar Toggle Function
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        // New Chat Start
        function startNewChat() {
            activeMessages = [activeMessages[0]]; 
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `<div class="message bot">မင်္ဂလာပါ! စာမျက်နှာအသစ် စတင်လိုက်ပါပြီ။ ဘာတွေ ကူညီပေးရမလဲခင်ဗျာ။</div>`;
            toggleSidebar();
        }

        // Render History
        window.renderHistoricalChat = function(userMsg, aiReply) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `
                <div class="message user">${escapeHtml(userMsg)}</div>
                <div class="message bot">${marked.parse(aiReply)}</div>
            `;
        };

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            input.value = "";

            activeMessages.push({ role: "user", content: text });

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: activeMessages,
                        temperature: 0.5
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    activeMessages.push({ role: "assistant", content: aiReply });
                    
                    chatBox.innerHTML += `<div class="message bot">${marked.parse(aiReply)}</div>`;

                    // Firestore Auto Save
                    if (window.saveChatToFirestore) {
                        window.saveChatToFirestore(text, aiReply);
                    }
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot" style="color:red;">Error ဖြစ်ပေါ်နေပါသည်။ ပြန်လည်ကြိုးစားပေးပါ။</div>`;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
    </html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RLay AI Assistant</title>
    <!-- Code Blocks များ သေချာ ပြသရန် Marked.js ထည့်သွင်းခြင်း -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Firebase SDK Modules ထည့်သွင်းခြင်း (Firestore API သုံးနိုင်ရန်) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 သင့်ရဲ့ Firebase/Firestore Config Details များကို ဒီမှာ ထည့်သွင်းပါ
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY_HERE",
            authDomain: "rlays-ai-dictionary.firebaseapp.com",
            projectId: "rlays-ai-dictionary",
            storageBucket: "rlays-ai-dictionary.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase / Firestore Initialize လုပ်ခြင်း
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global scope သို့ Firestore Function များကို ပို့ပေးခြင်း
        window.saveChatToFirestore = async function(userText, aiReplyText) {
            try {
                await addDoc(collection(db, "chat_history"), {
                    userMessage: userText,
                    aiResponse: aiReplyText,
                    timestamp: serverTimestamp()
                });
                console.log("Chat successfully saved to Firestore!");
            } catch (e) {
                console.error("Error adding document to Firestore: ", e);
            }
        };
    </script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; background-color: #131314; color: #e3e3e3; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header UI */
        .header { padding: 14px 20px; background: #1e1f20; border-bottom: 1px solid #2e2f31; display: flex; justify-content: space-between; align-items: center; }
        .header h3 { margin: 0; color: #a8c7fa; font-size: 16px; font-weight: 600; }

        /* Chat Area */
        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 90%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
        .user { background: #282a2c; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #1e1f20; color: #c4c7c5; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2e2f31; }

        /* Code Block Styling (Gemini Style) */
        pre { background: #0d0e0f; padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid #333; margin: 8px 0; }
        code { font-family: monospace; color: #75beff; font-size: 14px; }

        /* Input Area */
        .input-area-wrapper { padding: 12px 16px; background: #131314; border-top: 1px solid #2e2f31; }
        .input-area { max-width: 800px; margin: 0 auto; display: flex; background: #1e1f20; border-radius: 28px; padding: 4px 8px 4px 16px; border: 1px solid #333; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
        button.send-btn { background: #a8c7fa; color: #040c1e; border: none; border-radius: 20px; padding: 8px 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h3>✨ RLay Developer AI</h3>
    </div>

    <div id="chat-box">
        <div class="message bot">မင်္ဂလာပါ! ကျွန်တော်က RLay Developer AI ဖြစ်ပါတယ်။ HTML/CSS/JS Coding နဲ့ Web-to-App ဖန်တီးမှုတွေမှာ ဘာတွေ ကူညီပေးရမလဲခင်ဗျာ။</div>
    </div>

    <div class="input-area-wrapper">
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Coding သို့မဟုတ် တစ်ခုခု မေးမြန်းပါ..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">မေးမည်</button>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        
        // Gemini ကဲ့သို့ Coding Expert အဖြစ် ပြုမူစေမည့် System Prompt
        const activeMessages = [
            { 
                role: "system", 
                content: "You are RLay AI, an expert software developer and Web Coding specialist. You help users build websites and mobile apps, especially for users coding on mobile devices. When asked for code (like HTML, CSS, JavaScript), write clean, complete, and functional code inside Markdown code blocks. Always respond in fluent, accurate, and natural Myanmar language." 
            }
        ];

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            input.value = "";

            activeMessages.push({ role: "user", content: text });

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: activeMessages,
                        temperature: 0.5
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    activeMessages.push({ role: "assistant", content: aiReply });
                    
                    // Marked.js ဖြင့် Code Block များကို သန့်ရှင်းစွာ Render လုပ်ခြင်း
                    chatBox.innerHTML += `<div class="message bot">${marked.parse(aiReply)}</div>`;

                    // 🔥 Firestore ထဲသို့ User မေးခွန်းနှင့် AI ပြန်ဖြေချက်ကို Auto Cloud Sync/Save လုပ်ခြင်း
                    if (window.saveChatToFirestore) {
                        window.saveChatToFirestore(text, aiReply);
                    }
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot" style="color:red;">Error ဖြစ်ပေါ်နေပါသည်။ ပြန်လည်ကြိုးစားပေးပါ။</div>`;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>

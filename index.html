<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom AI Chatbot</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Top Bar Header */
        .header { 
            padding: 12px 15px; 
            border-bottom: 1px solid #333; 
            background: #181818; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h2 { margin: 0; color: #00ffcc; font-size: 16px; }
        .menu-btn {
            background: #2a2a2a;
            color: #00ffcc;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Slide-out Sidebar for Mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 20;
        }
        .sidebar-overlay.active { display: block; }

        .sidebar { 
            position: fixed;
            top: 0; left: -280px;
            width: 280px; 
            height: 100%;
            background-color: #1e1e1e; 
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            z-index: 30;
            transition: left 0.3s ease;
        }
        .sidebar.active { left: 0; }

        .new-chat-btn { 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 15px; 
            font-size: 14px; 
        }
        .history-list { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        .history-item { 
            padding: 12px; 
            border-radius: 8px; 
            background: #2a2a2a; 
            cursor: pointer; 
            font-size: 13px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .history-item span {
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            flex: 1;
        }
        .history-item.active { background: #007bff; color: white; }
        .delete-btn { color: #ff4d4d; border: none; background: none; cursor: pointer; font-size: 16px; padding: 0 5px; }

        /* Main Chat Area */
        .main-chat { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }

        /* Chat Messages Container */
        #chat-box { 
            flex: 1; 
            padding: 15px; 
            padding-bottom: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 15px; 
            word-wrap: break-word; 
        }
        .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #2d2d2d; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #00ffcc; }

        /* Mobile Fixed Bottom Input Area */
        .input-area-wrapper {
            position: sticky;
            bottom: 0;
            background: #181818;
            border-top: 1px solid #333;
            padding: 10px;
        }
        .input-area { 
            display: flex; 
            gap: 8px; 
            max-width: 800px;
            margin: 0 auto;
        }
        input { 
            flex: 1; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #2a2a2a; 
            color: white; 
            font-size: 16px; 
            outline: none; 
        }
        button.send-btn { 
            padding: 12px 20px; 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
        }
    </style>
</head>
<body>

    <!-- Overlay Background -->
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Slide-out Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ စကားဝိုင်းအသစ် (New Chat)</button>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- Top Header -->
    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰ စကားဝိုင်းများ</button>
        <h2>My Custom AI</h2>
        <div style="width: 50px;"></div>
    </div>

    <!-- Main Chat Window -->
    <div class="main-chat">
        <div id="chat-box"></div>

        <div class="input-area-wrapper">
            <div class="input-area">
                <input type="text" id="userInput" placeholder="တစ်ခုခု မေးမြန်းပါ..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">မေးမည်</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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"; 
        
        // မြန်မာစာ ယဉ်ကျေးသဘာဝကျစေရန် System Prompt ပြင်ဆင်ထားခြင်း
        const systemPrompt = { 
            role: "system", 
            content: "You are a helpful, polite, and intelligent AI assistant. Always respond in natural, fluent, and grammatically correct Burmese (Myanmar language). Avoid direct English literal translations. Do not repeat sentences or loop words endlessly." 
        };

        let allSessions = JSON.parse(localStorage.getItem("ai_all_sessions_v3")) || {};
        let currentSessionId = localStorage.getItem("ai_current_session_id_v3") || null;

        window.onload = function() {
            if (!currentSessionId || !allSessions[currentSessionId]) {
                createNewChat();
            } else {
                renderHistoryList();
                loadSession(currentSessionId);
            }
        };

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function createNewChat() {
            const sessionId = "chat_" + Date.now();
            allSessions[sessionId] = {
                title: "စကားဝိုင်းအသစ်",
                messages: [systemPrompt]
            };
            currentSessionId = sessionId;
            saveState();
            renderHistoryList();
            loadSession(currentSessionId);
            if (document.getElementById("sidebar").classList.contains("active")) {
                toggleSidebar();
            }
        }

        function saveState() {
            localStorage.setItem("ai_all_sessions_v3", JSON.stringify(allSessions));
            localStorage.setItem("ai_current_session_id_v3", currentSessionId);
        }

        function renderHistoryList() {
            const listEl = document.getElementById("historyList");
            listEl.innerHTML = "";

            Object.keys(allSessions).reverse().forEach(id => {
                const session = allSessions[id];
                const item = document.createElement("div");
                item.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
                
                item.innerHTML = `
                    <span onclick="switchSession('${id}')">${session.title}</span>
                    <button class="delete-btn" onclick="deleteSession(event, '${id}')">✕</button>
                `;
                listEl.appendChild(item);
            });
        }

        function switchSession(id) {
            currentSessionId = id;
            saveState();
            renderHistoryList();
            loadSession(id);
            toggleSidebar();
        }

        function loadSession(id) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
            const session = allSessions[id];

            if (!session) return;

            session.messages.forEach(msg => {
                if (msg.role === "user") {
                    chatBox.innerHTML += `<div class="message user">${msg.content}</div>`;
                } else if (msg.role === "assistant") {
                    chatBox.innerHTML += `<div class="message bot">${msg.content.replace(/\n/g, '<br>')}</div>`;
                }
            });
            scrollToBottom();
        }

        function deleteSession(e, id) {
            e.stopPropagation();
            delete allSessions[id];
            const keys = Object.keys(allSessions);
            if (keys.length > 0) {
                currentSessionId = keys[keys.length - 1];
            } else {
                createNewChat();
                return;
            }
            saveState();
            renderHistoryList();
            loadSession(currentSessionId);
        }

        function scrollToBottom() {
            setTimeout(() => {
                window.scrollTo(0, document.body.scrollHeight);
            }, 100);
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = input.value.trim();

            if (!text || !currentSessionId) return;

            const session = allSessions[currentSessionId];

            if (session.messages.length === 1) {
                session.title = text.length > 15 ? text.substring(0, 15) + "..." : text;
                renderHistoryList();
            }

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = "";
            scrollToBottom();

            session.messages.push({ role: "user", content: text });

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${loadingId}">စဉ်းစားနေသည်...</div>`;
            scrollToBottom();

            try {
                // API Call parameters ပြင်ဆင်ထားခြင်း (Infinite loop စာထပ်ခြင်းမှ ကာကွယ်ရန်)
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: session.messages,
                        temperature: 0.7,
                        max_tokens: 1024,
                        top_p: 0.9,
                        frequency_penalty: 0.5,
                        presence_penalty: 0.5
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="message bot">${aiReply.replace(/\n/g, '<br>')}</div>`;
                    session.messages.push({ role: "assistant", content: aiReply });
                    saveState();
                } else {
                    chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: AI စာပြန်ရန် မအောင်မြင်ပါ။</div>`;
                }
                
                scrollToBottom();
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot" style="color:red;">Error: ချိတ်ဆက်မှု မအောင်မြင်ပါ။</div>`;
                scrollToBottom();
            }
        }
    </script>
</body>
  </html>
